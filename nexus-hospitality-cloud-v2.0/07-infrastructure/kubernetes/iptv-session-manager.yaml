apiVersion: apps/v1
kind: Deployment
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
  labels:
    app: iptv-session-manager
    version: v2.3.1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: iptv-session-manager
  template:
    metadata:
      labels:
        app: iptv-session-manager
        version: v2.3.1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: iptv-session-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - iptv-session-manager
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - compute
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: iptv-session-manager
      containers:
        - name: session-manager
          image: nexushc/iptv-session-manager:v2.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: addr
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: IPTV_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iptv-jwt-secret
                  key: secret
            - name: STREAM_CONTROLLER_ADDR
              value: "iptv-stream-controller.nexus-iptv.svc.cluster.local:9090"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.nexus-observability.svc:4317"
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
  labels:
    app: iptv-session-manager
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
  selector:
    app: iptv-session-manager
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iptv-session-manager-hpa
  namespace: nexus-iptv
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iptv-session-manager
  minReplicas: 5
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: iptv_sessions_active
        target:
          type: AverageValue
          averageValue: "500"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iptv-session-manager-pdb
  namespace: nexus-iptv
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: iptv-session-manager
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
spec:
  host: iptv-session-manager.nexus-iptv.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
    loadBalancer:
      simple: LEAST_CONN
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  subsets:
    - name: stable
      labels:
        version: v2.3.1
    - name: canary
      labels:
        version: canary
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
spec:
  hosts:
    - iptv-session-manager.nexus-iptv.svc.cluster.local
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: iptv-session-manager.nexus-iptv.svc.cluster.local
            subset: canary
          weight: 100
    - route:
        - destination:
            host: iptv-session-manager.nexus-iptv.svc.cluster.local
            subset: stable
          weight: 95
        - destination:
            host: iptv-session-manager.nexus-iptv.svc.cluster.local
            subset: canary
          weight: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/iptv-session-manager-role
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iptv-session-manager
  namespace: nexus-iptv
spec:
  podSelector:
    matchLabels:
      app: iptv-session-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: nexus-global
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: nexus-data
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              name: nexus-iptv
        - podSelector:
            matchLabels:
              app: iptv-stream-controller
      ports:
        - protocol: TCP
          port: 9090
