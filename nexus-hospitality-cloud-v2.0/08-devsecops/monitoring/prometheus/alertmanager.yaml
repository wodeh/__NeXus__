global:
  smtp_smarthost: 'smtp.nexushc.com:587'
  smtp_from: 'alerts@nexushc.com'
  smtp_auth_username: 'alerts@nexushc.com'
  smtp_auth_password: '{{ .Env.SMTP_PASSWORD }}'
  slack_api_url: '{{ .Env.SLACK_WEBHOOK_URL }}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 15m
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 30s
      repeat_interval: 2h
      continue: true
    - match:
        team: iptv
      receiver: 'slack-iptv'
      group_wait: 10s
      repeat_interval: 30m
    - match:
        team: security
      receiver: 'security-team'
      group_wait: 0s
      repeat_interval: 1h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

receivers:
  - name: 'default'
    email_configs:
      - to: 'platform@nexushc.com'
        send_resolved: true
        headers:
          Subject: 'NHC Alert: {{ .GroupLabels.alertname }}'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '{{ .Env.PAGERDUTY_SERVICE_KEY }}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}'
        details:
          summary: '{{ .CommonAnnotations.summary }}'
          description: '{{ .CommonAnnotations.description }}'

  - name: 'slack-warnings'
    slack_configs:
      - channel: '#nhc-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n\n{{ end }}'
        actions:
          - type: button
            text: 'Runbook'
            url: '{{ .CommonAnnotations.runbook_url }}'
          - type: button
            text: 'Dashboard'
            url: 'https://grafana.nexushc.com/d/nhc-overview'

  - name: 'slack-iptv'
    slack_configs:
      - channel: '#iptv-ops'
        send_resolved: true
        title: 'IPTV Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'

  - name: 'security-team'
    slack_configs:
      - channel: '#security-alerts'
        send_resolved: true
        title: 'SECURITY: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n\n{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    email_configs:
      - to: 'security@nexushc.com'
        send_resolved: true
        headers:
          Subject: 'SECURITY ALERT: {{ .GroupLabels.alertname }}'
          X-Priority: '1'
