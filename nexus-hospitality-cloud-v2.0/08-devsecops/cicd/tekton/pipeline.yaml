apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: nhc-service-pipeline
  namespace: tekton-pipelines
spec:
  params:
    - name: service-name
      type: string
      description: "Name of the microservice to build"
    - name: git-url
      type: string
      description: "Git repository URL"
    - name: git-revision
      type: string
      default: "main"
      description: "Git branch or commit SHA"
    - name: image-tag
      type: string
      description: "Docker image tag"
    - name: environment
      type: string
      default: "staging"
      description: "Target environment"
  workspaces:
    - name: source
    - name: docker-config
    - name: reports
    - name: helm-charts
  tasks:
    - name: clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: depth
          value: "0"
        - name: sslVerify
          value: "true"
      workspaces:
        - name: output
          workspace: source

    - name: sast-scan
      runAfter: [clone]
      taskRef:
        name: sonarqube-scan
      params:
        - name: project-key
          value: "nhc-$(params.service-name)"
        - name: sources
          value: "."
        - name: quality-gate
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: dependency-check
      runAfter: [clone]
      taskRef:
        name: snyk-scan
      params:
        - name: severity-threshold
          value: "high"
        - name: fail-on-issues
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: secret-scan
      runAfter: [clone]
      taskRef:
        name: trufflehog-scan
      params:
        - name: args
          value: "filesystem . --only-verified --fail"
      workspaces:
        - name: source
          workspace: source

    - name: unit-tests
      runAfter: [clone]
      taskRef:
        name: golang-test
      params:
        - name: packages
          value: "./..."
        - name: flags
          value: "-race -coverprofile=coverage.out"
      workspaces:
        - name: source
          workspace: source
        - name: reports
          workspace: reports

    - name: build-image
      runAfter: [unit-tests, sast-scan, dependency-check, secret-scan]
      taskRef:
        name: kaniko-build
      params:
        - name: dockerfile
          value: "./Dockerfile"
        - name: image
          value: "nexushc/$(params.service-name):$(params.image-tag)"
        - name: build-args
          value: "SERVICE_NAME=$(params.service-name)"
      workspaces:
        - name: source
          workspace: source
        - name: docker-config
          workspace: docker-config

    - name: image-scan
      runAfter: [build-image]
      taskRef:
        name: trivy-scan
      params:
        - name: image
          value: "nexushc/$(params.service-name):$(params.image-tag)"
        - name: severity
          value: "HIGH,CRITICAL"
        - name: exit-code
          value: "1"
      workspaces:
        - name: reports
          workspace: reports

    - name: sign-image
      runAfter: [image-scan]
      taskRef:
        name: cosign-sign
      params:
        - name: image
          value: "nexushc/$(params.service-name):$(params.image-tag)"
        - name: key
          value: "k8s://tekton-pipelines/cosign-key"

    - name: generate-sbom
      runAfter: [sign-image]
      taskRef:
        name: syft-sbom
      params:
        - name: image
          value: "nexushc/$(params.service-name):$(params.image-tag)"
        - name: format
          value: "spdx-json"
      workspaces:
        - name: reports
          workspace: reports

    - name: deploy-staging
      runAfter: [sign-image, generate-sbom]
      taskRef:
        name: argocd-sync
      params:
        - name: application-name
          value: "$(params.service-name)-staging"
        - name: revision
          value: "$(params.image-tag)"
        - name: flags
          value: "--prune --timeout 300"

    - name: integration-tests
      runAfter: [deploy-staging]
      taskRef:
        name: k6-load-test
      params:
        - name: script
          value: "./tests/load/$(params.service-name).js"
        - name: vus
          value: "100"
        - name: duration
          value: "5m"
      workspaces:
        - name: source
          workspace: source

    - name: dast-scan
      runAfter: [deploy-staging]
      taskRef:
        name: owasp-zap-scan
      params:
        - name: target
          value: "https://$(params.service-name)-staging.nexushc.com"
        - name: scan-type
          value: "full-scan"
        - name: fail-on-risk-level
          value: "HIGH"
      workspaces:
        - name: reports
          workspace: reports

    - name: performance-test
      runAfter: [integration-tests]
      taskRef:
        name: k6-load-test
      params:
        - name: script
          value: "./tests/performance/$(params.service-name).js"
        - name: vus
          value: "1000"
        - name: duration
          value: "10m"
      workspaces:
        - name: source
          workspace: source

    - name: deploy-production
      runAfter: [performance-test, dast-scan]
      taskRef:
        name: argocd-sync
      params:
        - name: application-name
          value: "$(params.service-name)-production"
        - name: revision
          value: "$(params.image-tag)"
        - name: strategy
          value: "canary"
        - name: flags
          value: "--prune --timeout 600"

    - name: smoke-tests
      runAfter: [deploy-production]
      taskRef:
        name: curl-smoke-test
      params:
        - name: url
          value: "https://$(params.service-name).nexushc.com/health"
        - name: expected-status
          value: "200"
        - name: retries
          value: "10"

  finally:
    - name: notify
      taskRef:
        name: slack-notification
      params:
        - name: message
          value: "Pipeline $(params.service-name) completed"
        - name: webhook-secret
          value: "slack-webhook"
