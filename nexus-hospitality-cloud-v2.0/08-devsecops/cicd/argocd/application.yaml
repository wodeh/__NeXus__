apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nhc-iptv-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: nhc-production
  source:
    repoURL: https://github.com/nexushc/infrastructure.git
    targetRevision: main
    path: overlays/production/iptv
    helm:
      valueFiles:
        - values-production.yaml
      parameters:
        - name: global.environment
          value: "production"
        - name: global.tenantIsolation
          value: "schema"
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus-iptv
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/metrics
  revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nhc-production
  namespace: argocd
spec:
  description: "Nexus Hospitality Cloud Production"
  sourceRepos:
    - "https://github.com/nexushc/*"
  destinations:
    - namespace: "nexus-*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  roles:
    - name: platform-admin
      description: "Platform team admin access"
      policies:
        - p, proj:nhc-production:platform-admin, applications, *, nhc-production/*, allow
      groups:
        - platform-team
    - name: sre
      description: "SRE read-only access"
      policies:
        - p, proj:nhc-production:sre, applications, get, nhc-production/*, allow
        - p, proj:nhc-production:sre, applications, sync, nhc-production/*, allow
      groups:
        - sre-team
