- rule: Unauthorized Database Access
  desc: Detect unauthorized attempts to access PostgreSQL databases
  condition: >
    spawned_process and
    container.name contains "postgres" and
    (proc.name in (psql, pg_dump, pg_restore) or
     proc.cmdline contains "SELECT * FROM" or
     proc.cmdline contains "COPY") and
    not (proc.user.name in (postgres, app_user, backup_service) or
         proc.cmdline contains "health_check" or
         proc.cmdline contains "metrics")
  output: >
    Unauthorized database access attempt
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: CRITICAL
  tags: [database, postgresql, unauthorized_access, pci-dss]

- rule: PII Data Exfiltration
  desc: Detect bulk extraction of guest personal data
  condition: >
    spawned_process and
    (proc.cmdline contains "guests" or
     proc.cmdline contains "reservations" or
     proc.cmdline contains "folio") and
    (proc.cmdline contains "SELECT" or
     proc.cmdline contains "COPY TO" or
     proc.cmdline contains "\o ") and
    (proc.cmdline contains "passport" or
     proc.cmdline contains "credit_card" or
     proc.cmdline contains "ssn" or
     proc.cmdline contains "email" or
     proc.cmdline contains "phone") and
    not proc.user.name in (backup_service, analytics_etl, compliance_audit)
  output: >
    Potential PII exfiltration detected
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: CRITICAL
  tags: [pii, gdpr, data_exfiltration, compliance]

- rule: IPTV Stream Hijacking
  desc: Detect unauthorized stream redirection or DRM key extraction
  condition: >
    spawned_process and
    container.name contains "iptv" and
    (proc.name in (ffmpeg, curl, wget) or
     proc.cmdline contains "drm" or
     proc.cmdline contains "key" or
     proc.cmdline contains "widevine" or
     proc.cmdline contains "playready") and
    not (proc.user.name in (iptv_service, transcoder) or
         proc.cmdline contains "scheduled_task" or
         proc.cmdline contains "health")
  output: >
    Potential IPTV stream hijacking or DRM tampering
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: CRITICAL
  tags: [iptv, drm, piracy, content_protection]

- rule: IoT Device Firmware Tampering
  desc: Detect unauthorized firmware modifications on IoT devices
  condition: >
    spawned_process and
    container.name contains "iot" and
    (proc.cmdline contains "firmware" or
     proc.cmdline contains "ota" or
     proc.cmdline contains "flash" or
     proc.cmdline contains "bootloader") and
    not (proc.user.name in (iot_service, ota_manager) or
         proc.cmdline contains "scheduled_update")
  output: >
    Potential IoT firmware tampering
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: HIGH
  tags: [iot, firmware, supply_chain, ota]

- rule: Privilege Escalation via Sudo
  desc: Detect sudo usage in containers
  condition: >
    spawned_process and
    proc.name = "sudo" and
    not (proc.user.name in (admin, sre, platform_engineer) and
         k8s.ns.name in (kube-system, monitoring, security))
  output: >
    Privilege escalation attempt via sudo
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: HIGH
  tags: [privilege_escalation, container_security]

- rule: Cryptocurrency Mining
  desc: Detect cryptocurrency mining processes
  condition: >
    spawned_process and
    (proc.name in (xmrig, minerd, stratum, cpuminer) or
     proc.cmdline contains "stratum+tcp" or
     proc.cmdline contains "stratum+ssl" or
     proc.cmdline contains "--donate-level" or
     proc.cmdline contains "-o pool.")
  output: >
    Cryptocurrency mining detected
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: CRITICAL
  tags: [cryptomining, resource_abuse, finops]

- rule: Kubernetes Secret Access
  desc: Detect unauthorized access to Kubernetes secrets
  condition: >
    spawned_process and
    (proc.cmdline contains "kubectl get secret" or
     proc.cmdline contains "kubectl describe secret" or
     proc.cmdline contains "etcdctl" or
     proc.cmdline contains "/var/lib/etcd") and
    not (proc.user.name in (k8s_admin, vault, external_secrets) or
         k8s.pod.label.app in (vault, external-secrets, cert-manager))
  output: >
    Unauthorized Kubernetes secret access
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: CRITICAL
  tags: [secrets, kubernetes, unauthorized_access]

- rule: Reverse Shell Detection
  desc: Detect reverse shell connections
  condition: >
    spawned_process and
    ((proc.name in (bash, sh, python, python3, perl, ruby) and
      (proc.cmdline contains "/dev/tcp/" or
       proc.cmdline contains "socket.socket" or
       proc.cmdline contains "pty.spawn")) or
     (proc.name in (nc, netcat, ncat) and
      (proc.cmdline contains "-e" or
       proc.cmdline contains "--exec" or
       proc.cmdline contains "-c")))
  output: >
    Reverse shell detected
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
    connection=%fd.name
  priority: CRITICAL
  tags: [reverse_shell, backdoor, lateral_movement]

- rule: Sensitive File Access
  desc: Detect access to sensitive configuration files
  condition: >
    open_read and
    (fd.name contains "/etc/shadow" or
     fd.name contains "/etc/passwd" or
     fd.name contains ".ssh/id_rsa" or
     fd.name contains ".aws/credentials" or
     fd.name contains ".kube/config" or
     fd.name contains "tls.key" or
     fd.name contains "private.key") and
    not (proc.user.name in (root, admin) and
         proc.name in (sshd, sudo, su))
  output: >
    Sensitive file access detected
    user=%proc.user.name file=%fd.name
    command=%proc.cmdline container=%container.name
  priority: HIGH
  tags: [sensitive_data, credential_access]

- rule: Outbound Connection to Suspicious IP
  desc: Detect outbound connections to known malicious IPs
  condition: >
    outbound and
    (fd.sip in (malicious_ip_list) or
     fd.sport in (4444, 5555, 6666, 7777, 8888, 9999) or
     (fd.sport >= 49000 and fd.sport <= 50000))
  output: >
    Suspicious outbound connection
    connection=%fd.name
    container=%container.name pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: HIGH
  tags: [network, c2, exfiltration]

- rule: Container Escape Attempt
  desc: Detect attempts to escape container boundaries
  condition: >
    spawned_process and
    (proc.cmdline contains "nsenter" or
     proc.cmdline contains "unshare" or
     proc.cmdline contains "capsh" or
     fd.name contains "/proc/1/ns" or
     fd.name contains "/host" or
     fd.name contains "/var/run/docker.sock" or
     fd.name contains "/run/containerd")
  output: >
    Container escape attempt detected
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: CRITICAL
  tags: [container_escape, privilege_escalation]

- rule: Unauthorized API Key Usage
  desc: Detect API keys being used from unexpected sources
  condition: >
    spawned_process and
    (proc.cmdline contains "api_key" or
     proc.cmdline contains "apikey" or
     proc.cmdline contains "api_secret") and
    (proc.cmdline contains "curl" or
     proc.cmdline contains "wget" or
     proc.cmdline contains "python") and
    not (k8s.pod.label.app in (api-gateway, payment-processor) or
         proc.user.name in (api_service))
  output: >
    Potential API key misuse
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: HIGH
  tags: [api_security, credential_abuse]

- rule: Mass File Deletion
  desc: Detect mass deletion operations
  condition: >
    spawned_process and
    proc.name in (rm, shred) and
    (proc.cmdline contains "-rf" or
     proc.cmdline contains "-fr" or
     proc.cmdline contains "/*") and
    not (proc.user.name in (cleanup_service, log_rotator) or
         proc.cmdline contains "/tmp/" or
         proc.cmdline contains "/var/log/")
  output: >
    Mass file deletion detected
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: HIGH
  tags: [destruction, ransomware, data_loss]

- rule: Tenant Isolation Breach
  desc: Detect cross-tenant data access
  condition: >
    spawned_process and
    (proc.cmdline contains "tenant_id" or
     proc.cmdline contains "tenantId") and
    (proc.cmdline contains "SELECT" or
     proc.cmdline contains "UPDATE" or
     proc.cmdline contains "DELETE") and
    proc.cmdline contains "WHERE" and
    not proc.cmdline contains "tenant_id = "
  output: >
    Potential tenant isolation breach - query missing tenant filter
    user=%proc.user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name
  priority: CRITICAL
  tags: [tenant_isolation, saas_security, data_breach]

- list: malicious_ip_list
  items: [
    "192.0.2.1", "198.51.100.1", "203.0.113.1",
    "10.0.0.99", "172.16.0.99"
  ]

- list: authorized_db_users
  items: [postgres, app_user, backup_service, analytics_etl, compliance_audit]

- list: authorized_iot_users
  items: [iot_service, ota_manager, device_manager]

- macro: spawned_process
  condition: (evt.type = execve and evt.dir=<)

- macro: open_read
  condition: (evt.type in (open, openat) and evt.dir=< and fd.type=file)

- macro: outbound
  condition: (evt.type in (connect) and evt.dir=< and fd.type=ipv4)
