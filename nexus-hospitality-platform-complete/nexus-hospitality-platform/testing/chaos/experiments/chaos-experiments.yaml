# testing/chaos/experiments/chaos-experiments.yaml
# ============================================================
# NEXUS CHAOS ENGINEERING — Production-grade fault injection
# ============================================================

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-iptv-failure-simulation
  namespace: chaos-testing
spec:
  entry: iptv-chaos-sequence
  templates:
    - name: iptv-chaos-sequence
      templateType: Serial
      deadline: 30m
      children:
        - name: inject-packet-loss
        - name: inject-latency-spike
        - name: kill-transcode-pods
        - name: partition-nginx-nodes
        - name: fill-disk-cache
        - name: stress-gpu-memory

    # Packet loss simulation (network degradation)
    - name: inject-packet-loss
      templateType: NetworkChaos
      networkChaos:
        action: loss
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: iptv-transcode
        loss:
          loss: "10"
          correlation: "100"
        duration: 5m

    # Latency spike (buffering simulation)
    - name: inject-latency-spike
      templateType: NetworkChaos
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: streaming-edge
        delay:
          latency: 500ms
          correlation: "50"
          jitter: 200ms
        duration: 5m

    # Kill transcoding pods (resilience test)
    - name: kill-transcode-pods
      templateType: PodChaos
      podChaos:
        action: pod-kill
        mode: fixed-percent
        value: "30"
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: iptv-transcode
        duration: 3m

    # Network partition between streaming tiers
    - name: partition-nginx-nodes
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: streaming-edge
        direction: both
        target:
          mode: all
          selector:
            namespaces:
              - nexus-prod
            labelSelectors:
              app.kubernetes.io/component: origin-backend
        duration: 5m

    # Disk pressure on cache nodes
    - name: fill-disk-cache
      templateType: StressChaos
      stressChaos:
        mode: one
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: streaming-edge
        stressors:
          disk:
            workers: 4
            size: 50GiB
        duration: 5m

    # GPU memory exhaustion
    - name: stress-gpu-memory
      templateType: StressChaos
      stressChaos:
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: iptv-transcode
        stressors:
          memory:
            workers: 2
            size: 90%
        duration: 5m

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-pms-failover-test
  namespace: chaos-testing
spec:
  entry: pms-failover-sequence
  templates:
    - name: pms-failover-sequence
      templateType: Serial
      deadline: 45m
      children:
        - name: kill-postgres-primary
        - name: kill-redis-master
        - name: partition-kafka-brokers
        - name: kill-pms-api-pods
        - name: inject-db-connection-pool-exhaustion
        - name: trigger-saga-compensation

    # PostgreSQL primary failover
    - name: kill-postgres-primary
      templateType: PodChaos
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: postgres-primary
        duration: 10m

    # Redis master failover
    - name: kill-redis-master
      templateType: PodChaos
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: redis-master
        duration: 5m

    # Kafka broker partition
    - name: partition-kafka-brokers
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: fixed
        value: "1"
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: kafka-broker
        direction: both
        target:
          mode: all
          selector:
            namespaces:
              - nexus-prod
            labelSelectors:
              app.kubernetes.io/component: pms-core
        duration: 10m

    # PMS API pod chaos
    - name: kill-pms-api-pods
      templateType: PodChaos
      podChaos:
        action: pod-kill
        mode: fixed-percent
        value: "50"
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: pms-core
        duration: 5m

    # Connection pool exhaustion
    - name: inject-db-connection-pool-exhaustion
      templateType: StressChaos
      stressChaos:
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: pms-core
        stressors:
          cpu:
            workers: 4
            load: 80
        duration: 5m

    # Saga compensation trigger
    - name: trigger-saga-compensation
      templateType: IOChaos
      ioChaos:
        action: latency
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: pms-core
        volumePath: /data
        path: /data/saga-state/*
        delay: 10s
        duration: 5m

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-ai-degradation-test
  namespace: chaos-testing
spec:
  entry: ai-degradation-sequence
  templates:
    - name: ai-degradation-sequence
      templateType: Serial
      deadline: 30m
      children:
        - name: kill-gpu-nodes
        - name: inject-inference-latency
        - name: corrupt-model-cache
        - name: partition-vector-db
        - name: stress-mlflow-server

    # GPU node failure (AI inference)
    - name: kill-gpu-nodes
      templateType: NodeChaos
      nodeChaos:
        action: node-kill
        mode: fixed-percent
        value: "25"
        selector:
          nodeSelectors:
            nvidia.com/gpu.present: "true"
        duration: 10m

    # Inference latency injection
    - name: inject-inference-latency
      templateType: NetworkChaos
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: ai-inference
        delay:
          latency: 5s
          correlation: "100"
        duration: 10m

    # Model cache corruption
    - name: corrupt-model-cache
      templateType: IOChaos
      ioChaos:
        action: fault
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: ai-inference
        volumePath: /models
        path: /models/*.pt
        errno: 5
        duration: 5m

    # Vector DB partition (RAG disruption)
    - name: partition-vector-db
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: vector-db
        direction: both
        target:
          mode: all
          selector:
            namespaces:
              - nexus-prod
            labelSelectors:
              app.kubernetes.io/component: ai-inference
        duration: 5m

    # MLFlow server stress
    - name: stress-mlflow-server
      templateType: StressChaos
      stressChaos:
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: mlflow-tracking
        stressors:
          cpu:
            workers: 4
            load: 100
        duration: 5m

---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: nexus-multi-region-outage
  namespace: chaos-testing
spec:
  entry: multi-region-outage
  templates:
    - name: multi-region-outage
      templateType: Serial
      deadline: 60m
      children:
        - name: isolate-us-east-1
        - name: isolate-eu-west-1
        - name: dns-failure-simulation
        - name: cross-region-replication-lag
        - name: failback-test

    # Isolate US-East-1 (primary region failure)
    - name: isolate-us-east-1
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            topology.kubernetes.io/region: us-east-1
        direction: both
        externalTargets:
          - "api.nexus-platform.com"
          - "streaming.nexus-platform.com"
        duration: 15m

    # Isolate EU-West-1 (secondary region failure)
    - name: isolate-eu-west-1
      templateType: NetworkChaos
      networkChaos:
        action: partition
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            topology.kubernetes.io/region: eu-west-1
        direction: both
        duration: 15m

    # DNS failure simulation
    - name: dns-failure-simulation
      templateType: DNSChaos
      dnsChaos:
        action: error
        mode: all
        selector:
          namespaces:
            - nexus-prod
        patterns:
          - "*.nexus-platform.com"
        duration: 10m

    # Cross-region replication lag
    - name: cross-region-replication-lag
      templateType: NetworkChaos
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - nexus-prod
          labelSelectors:
            app.kubernetes.io/component: database-replica
        delay:
          latency: 30s
          correlation: "100"
        duration: 10m

    # Failback verification
    - name: failback-test
      templateType: Schedule
      schedule:
        type: "Once"
        startTime: "2024-01-01T00:00:00Z"
        concurrencyPolicy: "Forbid"
        workflowSpec:
          entry: verify-failback
          templates:
            - name: verify-failback
              templateType: Serial
              children:
                - name: health-check-all-regions
                - name: data-consistency-check
                - name: performance-baseline-check

---
# Scheduled chaos (nightly chaos engineering)
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: nightly-chaos-schedule
  namespace: chaos-testing
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  concurrencyPolicy: "Forbid"
  type: "Workflow"
  workflowSpec:
    entry: nightly-chaos-suite
    templates:
      - name: nightly-chaos-suite
        templateType: Parallel
        deadline: 2h
        children:
          - name: run-iptv-chaos
          - name: run-pms-chaos
          - name: run-ai-chaos
          - name: run-iot-chaos

      - name: run-iptv-chaos
        templateType: Workflow
        workflow:
          name: nexus-iptv-failure-simulation

      - name: run-pms-chaos
        templateType: Workflow
        workflow:
          name: nexus-pms-failover-test

      - name: run-ai-chaos
        templateType: Workflow
        workflow:
          name: nexus-ai-degradation-test

      - name: run-iot-chaos
        templateType: Workflow
        workflow:
          name: nexus-iot-disruption-test
