# infrastructure/gitops/bootstrap/flux-system.yaml
# ============================================================
# FLUX CD BOOTSTRAP — GitOps for multi-tenant, multi-region
# ============================================================

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nexus-platform
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/nexus-platform/nexus-gitops
  ref:
    branch: main
  secretRef:
    name: flux-github-token

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: nexus-platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    - apiVersion: apps/v1
      kind: Deployment
      name: external-dns
      namespace: external-dns
    - apiVersion: apps/v1
      kind: Deployment
      name: istiod
      namespace: istio-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services
  namespace: flux-system
spec:
  interval: 5m
  path: ./services/platform
  prune: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: nexus-platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: vault
      namespace: vault
    - apiVersion: apps/v1
      kind: Deployment
      name: prometheus
      namespace: monitoring

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-configs
  namespace: flux-system
spec:
  interval: 5m
  path: ./tenants
  prune: true
  dependsOn:
    - name: platform-services
  sourceRef:
    kind: GitRepository
    name: nexus-platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: tenant-defaults

---
# Tenant provisioning automation
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: tenant-provisioner
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: tenant-provisioner
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: nexus-charts
        namespace: flux-system
  values:
    provisioning:
      enabled: true
      autoApprove: false  # Require manual approval for production
      defaultTier: "standard"
      allowedTiers: ["standard", "enterprise", "sovereign"]
    namespaces:
      createNetworkPolicies: true
      createResourceQuotas: true
      createLimitRanges: true
    isolation:
      networkPolicyEnabled: true
      podSecurityPolicyEnabled: true
      runtimeClassName: "gvisor"  # For sovereign tenants
