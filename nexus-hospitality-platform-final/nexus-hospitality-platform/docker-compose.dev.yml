version: "3.8"
# docker-compose.dev.yml
# Local development environment with all services

services:
  # Core infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
      POSTGRES_DB: nexus_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/pms-integration/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./observability/analytics/clickhouse-schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Backend services
  backend-api:
    build:
      context: ./services/backend-core
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://nexus:nexus_dev@postgres:5432/nexus_platform?sslmode=disable
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/backend-core:/app
    command: ["air", "-c", ".air.toml"]

  pms-core:
    build:
      context: ./services/pms-integration
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://nexus:nexus_dev@postgres:5432/nexus_platform?sslmode=disable
      EVENT_BUS_URL: kafka://kafka:29092
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./services/pms-integration:/app

  # IPTV services
  iptv-transcode:
    build:
      context: ./services/iptv-middleware
      dockerfile: Dockerfile.dev
    ports:
      - "8082:8080"
    environment:
      GPU_ENABLED: "false"
      OUTPUT_BASE: /var/streams
    volumes:
      - ./services/iptv-middleware:/app
      - iptv_streams:/var/streams

  streaming-edge:
    image: nginx:alpine
    ports:
      - "8083:80"
      - "1935:1935"
    volumes:
      - ./services/iptv-middleware/streaming-edge/config/nginx-dev.conf:/etc/nginx/nginx.conf
      - iptv_streams:/var/hls

  # AI services
  ai-inference:
    build:
      context: ./services/ai-platform
      dockerfile: Dockerfile.dev
    ports:
      - "8084:8080"
    environment:
      MODEL_PATH: /models
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./services/ai-platform:/app
      - ai_models:/models

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /artifacts
    volumes:
      - mlflow_data:/mlflow
      - mlflow_artifacts:/artifacts

  # MQTT broker for IoT
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # IoT services
  iot-gateway:
    build:
      context: ./services/iot-gateway
      dockerfile: Dockerfile.dev
    ports:
      - "8085:8080"
    environment:
      MQTT_BROKER_URL: tcp://mqtt:1883
      DATABASE_URL: postgres://nexus:nexus_dev@postgres:5432/nexus_platform?sslmode=disable
    volumes:
      - ./services/iot-gateway:/app

  # Frontend
  web-portal:
    build:
      context: ./clients/web-portal
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
      REACT_APP_WS_URL: ws://localhost:8080
    volumes:
      - ./clients/web-portal:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  # Observability
  prometheus:
    image: prom/prometheus:v2.47
    ports:
      - "9090:9090"
    volumes:
      - ./observability/monitoring/prometheus-rules:/etc/prometheus/rules
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards

  loki:
    image: grafana/loki:2.9
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  jaeger:
    image: jaegertracing/all-in-one:1.49
    ports:
      - "16686:16686"
      - "14268:14268"

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  iptv_streams:
  ai_models:
  mlflow_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  loki_data:
