# infrastructure/helm-charts/nexus-platform/values-production.yaml
# Production environment configuration

replicaCount: 3

image:
  repository: ghcr.io/nexus-platform
  tag: stable
  pullPolicy: Always

autoscaling:
  enabled: true
  backend:
    minReplicas: 3
    maxReplicas: 100
  iptv:
    minReplicas: 2
    maxReplicas: 50
  ai:
    minReplicas: 2
    maxReplicas: 20
  iot:
    minReplicas: 3
    maxReplicas: 100

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 4Gi

postgresql:
  enabled: false  # Use managed RDS in production
  external:
    host: nexus-prod-db.cluster-xxx.us-east-1.rds.amazonaws.com
    port: 5432
    database: nexus_platform
    username: nexus_prod
    passwordSecret: nexus-db-credentials

redis:
  enabled: false  # Use managed ElastiCache
  external:
    host: nexus-prod-cache.xxx.cache.amazonaws.com
    port: 6379
    passwordSecret: nexus-cache-credentials

kafka:
  enabled: false  # Use managed MSK
  external:
    brokers: b-1.nexus-msk.xxx.kafka.us-east-1.amazonaws.com:9094,b-2.nexus-msk.xxx.kafka.us-east-1.amazonaws.com:9094

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
  hosts:
    - host: api.nexus-platform.com
      paths:
        - path: /
          pathType: Prefix
    - host: streaming.nexus-platform.com
      paths:
        - path: /hls
          pathType: Prefix
        - path: /dash
          pathType: Prefix
  tls:
    - secretName: nexus-prod-tls
      hosts:
        - api.nexus-platform.com
        - streaming.nexus-platform.com

monitoring:
  enabled: true
  prometheus:
    enabled: true
    retention: 30d
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
  alerting:
    enabled: true
    slack:
      webhookSecret: nexus-alerting-slack

networkPolicy:
  enabled: true
  defaultDeny: true

podDisruptionBudget:
  enabled: true
  minAvailable: 50%

canary:
  enabled: true
  steps:
    - weight: 5
      duration: 10m
    - weight: 25
      duration: 15m
    - weight: 50
      duration: 15m
    - weight: 100

disasterRecovery:
  enabled: true
  rpo: 5m
  rto: 15m
  backupSchedule: "0 */6 * * *"
