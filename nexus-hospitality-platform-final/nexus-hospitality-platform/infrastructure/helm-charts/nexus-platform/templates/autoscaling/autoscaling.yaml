---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "nexus-platform.fullname" . }}-backend-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.fullname" . }}-backend-api
  minReplicaCount: {{ .Values.autoscaling.backend.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.backend.maxReplicas }}
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 10
              periodSeconds: 15
          selectPolicy: Max
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: http_request_duration_seconds
        threshold: '500'
        query: |
          histogram_quantile(0.99, 
            sum(rate(http_request_duration_seconds_bucket{
              service="{{ include "nexus-platform.fullname" . }}-backend-api"
            }[2m])) by (le)
          ) * 1000
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: http_requests_per_second
        threshold: '1000'
        query: |
          sum(rate(http_requests_total{
            service="{{ include "nexus-platform.fullname" . }}-backend-api"
          }[2m]))
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
    - type: memory
      metadata:
        type: Utilization
        value: "80"
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.kafka.bootstrapServers }}
        consumerGroup: nexus-backend-api
        topic: pms-events
        lagThreshold: "1000"
        activationLagThreshold: "100"

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "nexus-platform.fullname" . }}-iptv-transcode
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: iptv-transcode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.fullname" . }}-iptv-transcode
  minReplicaCount: {{ .Values.autoscaling.iptv.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.iptv.maxReplicas }}
  cooldownPeriod: 600
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: nvidia_gpu_utilization
        threshold: '80'
        query: |
          avg(nvidia_gpu_utilization_gpu{
            pod=~"{{ include "nexus-platform.fullname" . }}-iptv-transcode-.*"
          })
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: transcode_queue_depth
        threshold: '10'
        query: |
          transcode_queue_depth{
            service="iptv-transcode"
          }
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: active_streams
        threshold: '50'
        query: |
          sum(iptv_active_streams{
            service="iptv-transcode"
          }) / count(nvidia_gpu_utilization_gpu{
            pod=~"{{ include "nexus-platform.fullname" . }}-iptv-transcode-.*"
          })

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "nexus-platform.fullname" . }}-ai-inference
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.fullname" . }}-ai-inference
  minReplicaCount: {{ .Values.autoscaling.ai.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.ai.maxReplicas }}
  cooldownPeriod: 900
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: inference_queue_depth
        threshold: '20'
        query: |
          sum(inference_request_queue_depth{
            model=~".*"
          })
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: nvidia_gpu_memory_used
        threshold: '85'
        query: |
          avg(nvidia_gpu_memory_used_bytes{
            pod=~"{{ include "nexus-platform.fullname" . }}-ai-inference-.*"
          } / nvidia_gpu_memory_total_bytes{
            pod=~"{{ include "nexus-platform.fullname" . }}-ai-inference-.*"
          }) * 100
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: inference_latency_p95
        threshold: '200'
        query: |
          histogram_quantile(0.95,
            sum(rate(inference_request_duration_seconds_bucket{
              service="ai-inference"
            }[2m])) by (le)
          ) * 1000
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: spot_preemption_risk
        threshold: '0.5'
        query: |
          avg(aws_spot_instance_preemption_risk{
            nodepool="ai-gpu"
          })

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "nexus-platform.fullname" . }}-iot-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: iot-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "nexus-platform.fullname" . }}-iot-gateway
  minReplicaCount: {{ .Values.autoscaling.iot.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.iot.maxReplicas }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: mqtt_connections_per_pod
        threshold: '5000'
        query: |
          sum(mqtt_connected_clients{
            service="iot-gateway"
          }) / count(kube_pod_status_ready{
            pod=~"{{ include "nexus-platform.fullname" . }}-iot-gateway-.*",
            condition="true"
          })
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: mqtt_messages_per_second
        threshold: '10000'
        query: |
          sum(rate(mqtt_messages_received_total{
            service="iot-gateway"
          }[2m]))
    - type: cpu
      metadata:
        type: Utilization
        value: "75"

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "nexus-platform.fullname" . }}-backend-api-cron
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexus-platform.fullname" . }}-backend-api
  triggers:
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 14 * * *
        end: 0 18 * * *
        desiredReplicas: "50"
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 10 * * *
        end: 0 13 * * *
        desiredReplicas: "40"
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 19 * * *
        end: 0 23 * * *
        desiredReplicas: "60"

---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: nexus-general-workloads
  namespace: karpenter
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m6i.2xlarge", "m6i.4xlarge", "m6a.2xlarge", "m6a.4xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["us-east-1a", "us-east-1b", "us-east-1c"]
      nodeClassRef:
        name: nexus-default
      resources:
        cpu: 1000
        memory: 4000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
  weight: 100

---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: nexus-gpu-workloads
  namespace: karpenter
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g5.2xlarge", "g5.4xlarge", "p4d.24xlarge"]
        - key: nvidia.com/gpu.present
          operator: In
          values: ["true"]
      nodeClassRef:
        name: nexus-gpu
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      resources:
        cpu: 500
        memory: 2000Gi
        nvidia.com/gpu: 100
  disruption:
    consolidationPolicy: WhenEmpty
    expireAfter: 168h

---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: nexus-memory-optimized
  namespace: karpenter
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["r6i.8xlarge", "r6i.12xlarge", "r6a.8xlarge"]
      nodeClassRef:
        name: nexus-memory
      resources:
        cpu: 800
        memory: 6000Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexus-platform.fullname" . }}-backend-api
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      {{- include "nexus-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend-api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexus-platform.fullname" . }}-iptv-transcode
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "nexus-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: iptv-transcode

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nexus-critical
value: 1000000
globalDefault: false
description: "Critical platform services (auth, billing, PMS core)"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nexus-high
value: 500000
globalDefault: false
description: "High priority services (IPTV streaming, IoT gateway)"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nexus-standard
value: 100000
globalDefault: true
description: "Standard priority services"

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: nexus-batch
value: 1000
globalDefault: false
description: "Batch and background jobs (AI training, analytics)"
