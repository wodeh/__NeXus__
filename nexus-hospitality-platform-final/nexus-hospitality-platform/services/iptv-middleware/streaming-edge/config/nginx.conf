user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

load_module modules/ngx_http_js_module.so;
load_module modules/ngx_stream_module.so;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_analytics escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"tenant":"$tenant_id",'
        '"stream":"$stream_id",'
        '"profile":"$profile_name",'
        '"remote_addr":"$remote_addr",'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"status":$status,'
        '"cache_status":"$upstream_cache_status",'
        '"cdn_edge":"$hostname",'
        '"region":"$region",'
        '"user_agent":"$http_user_agent",'
        '"session_id":"$session_id",'
        '"buffer_ratio":$buffer_ratio,'
        '"bitrate":$current_bitrate'
    '}';

    access_log /var/log/nginx/access.log json_analytics buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    limit_req_zone $tenant_id zone=tenant_limit:100m rate=1000r/s;
    limit_conn_zone $tenant_id zone=tenant_conn:100m;

    geoip_country /etc/nginx/geoip/GeoIP.dat;
    geoip_city /etc/nginx/geoip/GeoLiteCity.dat;

    map $arg_tenant $tenant_id {
        default $arg_tenant;
        "" "anonymous";
    }

    map $uri $stream_id {
        ~^/hls/([^/]+)/ $1;
        default "";
    }

    map $uri $profile_name {
        ~^/hls/[^/]+/([^/]+)/ $1;
        default "";
    }

    lua_shared_dict stream_health 100m;
    lua_shared_dict session_store 50m;
    lua_shared_dict token_cache 50m;

    upstream origin_backend {
        least_conn;
        server origin-us-east-1.internal:8080 weight=5;
        server origin-us-east-2.internal:8080 weight=5;
        server origin-us-west-1.internal:8080 weight=3 backup;

        keepalive 1000;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls_cache:2g max_size=500g 
                     inactive=60m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/dash levels=1:2 keys_zone=dash_cache:1g max_size=200g 
                     inactive=30m use_temp_path=off;

    server {
        listen 80;
        listen 443 ssl http2;
        server_name *.nexus-streaming.com;
        root /var/www/html;

        ssl_certificate /etc/nginx/ssl/wildcard.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.key;
        ssl_protocols TLSv1.3;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:;" always;
        add_header X-Request-ID $request_id always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /metrics {
            access_log off;
            allow 10.0.0.0/8;
            deny all;
            content_by_lua_block {
                require("prometheus").collect()
            }
        }

        location ~ ^/hls/(?<stream>[^/]+)/(?<profile>[^/]+)/ {
            auth_request /auth;
            auth_request_set $auth_status $upstream_status;

            limit_req zone=tenant_limit burst=200 nodelay;
            limit_conn tenant_conn 50;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Authorization" always;

            location ~ \.m3u8$ {
                proxy_cache hls_cache;
                proxy_cache_valid 200 2s;
                proxy_cache_use_stale updating error timeout;
                proxy_cache_background_update on;
                proxy_cache_lock on;

                add_header Cache-Control "private, max-age=1" always;

                proxy_pass http://origin_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Stream-ID $stream;
                proxy_set_header X-Profile $profile;
                proxy_set_header X-Tenant-ID $tenant_id;
                proxy_set_header X-Request-ID $request_id;

                gzip on;
                gzip_types application/vnd.apple.mpegurl;
            }

            location ~ \.ts$ {
                proxy_cache hls_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_use_stale error timeout;
                add_header Cache-Control "public, max-age=3600" always;
                proxy_pass http://origin_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Stream-ID $stream;
                proxy_set_header X-Profile $profile;
            }

            location ~ \.m4s$ {
                proxy_cache hls_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_use_stale error timeout;
                add_header Cache-Control "public, max-age=3600" always;
                proxy_pass http://origin_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Stream-ID $stream;
                proxy_set_header X-Profile $profile;
            }

            location ~ _part\d+\.m4s$ {
                proxy_cache hls_cache;
                proxy_cache_valid 200 2s;
                proxy_cache_use_stale updating;
                add_header Cache-Control "public, max-age=2" always;
                proxy_pass http://origin_backend;
                proxy_buffering off;
                proxy_cache off;
            }

            location ~ \.prefetch\.m4s$ {
                proxy_pass http://origin_backend;
                proxy_buffering off;
                proxy_cache off;
            }
        }

        location ~ ^/dash/(?<stream>[^/]+)/ {
            auth_request /auth;

            location ~ \.mpd$ {
                proxy_cache dash_cache;
                proxy_cache_valid 200 2s;
                proxy_cache_use_stale updating;
                add_header Cache-Control "private, max-age=1";
                proxy_pass http://origin_backend;
            }

            location ~ \.m4s$ {
                proxy_cache dash_cache;
                proxy_cache_valid 200 1h;
                add_header Cache-Control "public, max-age=3600";
                proxy_pass http://origin_backend;
            }
        }

        location /whip {
            proxy_pass http://webrtc_origin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /whep {
            proxy_pass http://webrtc_origin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location = /auth {
            internal;
            proxy_pass http://auth_service/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Token $arg_token;
            proxy_set_header X-Tenant-ID $tenant_id;
            proxy_set_header X-Stream-ID $stream_id;
        }

        location /epg/ {
            auth_request /auth;
            proxy_pass http://epg_service/;
            proxy_set_header X-Tenant-ID $tenant_id;
        }

        location ~ ^/dvr/(?<stream>[^/]+)/ {
            auth_request /auth;
            set $dvr_start $arg_start;
            set $dvr_end $arg_end;
            proxy_pass http://dvr_service/playback?stream=$stream&start=$dvr_start&end=$dvr_end;
            proxy_set_header X-Tenant-ID $tenant_id;
        }
    }

    upstream auth_service {
        server auth-service.internal:8080;
        keepalive 100;
    }

    upstream webrtc_origin {
        server webrtc-1.internal:8080;
        server webrtc-2.internal:8080;
        keepalive 100;
    }

    upstream epg_service {
        server epg-service.internal:8080;
        keepalive 50;
    }

    upstream dvr_service {
        server dvr-service.internal:8080;
        keepalive 50;
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        allow publish 10.0.0.0/8;
        deny publish all;

        application live {
            live on;
            record off;

            push rtmp://transcode-1.internal:1935/live;
            push rtmp://transcode-2.internal:1935/live;

            hls on;
            hls_path /var/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;

            on_publish http://auth_service/validate_publish;
        }
    }
}

init_worker_by_lua_block {
    local health = require "stream_health"
    health.start_monitoring()
}
