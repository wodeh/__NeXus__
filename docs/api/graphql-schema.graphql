type Query {
  # Guest queries
  guest(guestId: ID!): Guest
  guests(
    tenantId: ID!
    propertyId: ID
    query: String
    email: String
    page: Int = 1
    limit: Int = 50
  ): GuestConnection

  # Reservation queries
  reservation(reservationId: ID!): Reservation
  reservations(
    tenantId: ID!
    propertyId: ID
    status: ReservationStatus
    checkInFrom: Date
    checkInTo: Date
    page: Int = 1
    limit: Int = 50
  ): ReservationConnection

  # Room queries
  room(roomId: ID!): Room
  rooms(
    tenantId: ID!
    propertyId: ID!
    status: RoomStatus
    floor: String
  ): [Room!]!

  # Availability
  availability(
    tenantId: ID!
    propertyId: ID!
    checkIn: Date!
    checkOut: Date!
    adults: Int = 2
    children: Int = 0
  ): AvailabilityResponse!

  # IPTV
  iptvSession(sessionId: ID!): IPTVSession
  iptvChannels(tenantId: ID!): [Channel!]!
  iptvVOD(tenantId: ID!): [VODContent!]!
  iptvEPG(
    tenantId: ID!
    channelId: ID
    date: Date
  ): [EPGEntry!]!

  # AI
  pricingRecommendation(
    tenantId: ID!
    propertyId: ID!
    roomTypeId: ID!
    checkIn: Date!
    checkOut: Date!
  ): PricingRecommendation!

  # Analytics
  dashboardMetrics(tenantId: ID!, propertyId: ID, period: String!): DashboardMetrics!
}

type Mutation {
  # Guest mutations
  createGuest(input: CreateGuestInput!): Guest!
  updateGuest(guestId: ID!, input: UpdateGuestInput!): Guest!
  mergeGuests(primaryGuestId: ID!, duplicateGuestId: ID!): Guest!

  # Reservation mutations
  createReservation(input: CreateReservationInput!): Reservation!
  updateReservation(reservationId: ID!, input: UpdateReservationInput!): Reservation!
  cancelReservation(reservationId: ID!, reason: String): Reservation!
  checkIn(reservationId: ID!, input: CheckInInput!): CheckInResult!
  checkOut(reservationId: ID!, input: CheckOutInput): CheckOutResult!

  # Room mutations
  updateRoomStatus(roomId: ID!, status: RoomStatus!, housekeepingStatus: HousekeepingStatus): Room!
  assignRoom(roomId: ID!, reservationId: ID!): Room!
  blockRoom(roomId: ID!, reason: String!, from: Date!, until: Date!): Room!

  # Billing mutations
  postCharge(folioId: ID!, input: PostChargeInput!): FolioItem!
  postPayment(folioId: ID!, input: PostPaymentInput!): FolioItem!
  closeFolio(folioId: ID!): Folio!

  # IPTV mutations
  createIPTVSession(input: CreateIPTVSessionInput!): IPTVSession!
  startStream(sessionId: ID!, input: StartStreamInput!): StreamResult!
  stopStream(sessionId: ID!): Boolean!

  # AI mutations
  sendConciergeMessage(input: ConciergeMessageInput!): ConciergeResponse!
}

type Subscription {
  # Real-time updates
  reservationUpdates(tenantId: ID!, propertyId: ID): Reservation!
  roomStatusUpdates(tenantId: ID!, propertyId: ID): Room!
  guestCheckInUpdates(tenantId: ID!, propertyId: ID): CheckInEvent!

  # IPTV
  iptvSessionUpdates(sessionId: ID!): IPTVSession!

  # AI
  conciergeStream(sessionId: ID!): ConciergeMessage!
}

type Guest {
  guestId: ID!
  tenantId: ID!
  propertyId: ID
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  mobile: String
  language: String
  nationality: String
  loyalty: LoyaltyInfo
  preferences: GuestPreferences
  identityVerified: Boolean!
  gdprConsent: Boolean!
  totalStays: Int!
  totalRevenue: Float!
  vipStatus: String
  tags: [String!]!
  customFields: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type LoyaltyInfo {
  memberId: String!
  tier: String!
  pointsBalance: Int!
  lifetimePoints: Int!
}

type GuestPreferences {
  roomType: String
  bedType: String
  highFloor: Boolean
  quietRoom: Boolean
  dietaryRestrictions: [String!]!
  pillowType: String
  preferredTemperature: Int
  interests: [String!]!
}

type GuestConnection {
  edges: [GuestEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GuestEdge {
  node: Guest!
  cursor: String!
}

type Reservation {
  reservationId: ID!
  tenantId: ID!
  propertyId: ID!
  confirmationNumber: String!
  status: ReservationStatus!
  guest: Guest!
  roomType: RoomType!
  room: Room
  checkInDate: Date!
  checkOutDate: Date!
  adults: Int!
  children: Int!
  rateCode: String
  totalAmount: Float!
  taxAmount: Float!
  currency: String!
  source: String
  specialRequests: String
  paymentStatus: String!
  folio: Folio
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ReservationConnection {
  edges: [ReservationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ReservationEdge {
  node: Reservation!
  cursor: String!
}

type Room {
  roomId: ID!
  tenantId: ID!
  propertyId: ID!
  roomNumber: String!
  roomType: RoomType!
  floor: String
  wing: String
  view: String
  status: RoomStatus!
  housekeepingStatus: HousekeepingStatus!
  isSmoking: Boolean!
  isAccessible: Boolean!
  maxOccupancy: Int!
  amenities: [String!]!
  smartLockId: String
  hvacZoneId: String
  iptvDeviceId: String
  lastOccupied: DateTime
}

type RoomType {
  roomTypeId: ID!
  name: String!
  description: String
  baseRate: Float!
  maxOccupancy: Int!
  bedType: String
  roomSize: Float
  amenities: [String!]!
}

type Folio {
  folioId: ID!
  reservation: Reservation!
  status: String!
  balance: Float!
  totalCharges: Float!
  totalPayments: Float!
  currency: String!
  items: [FolioItem!]!
}

type FolioItem {
  folioItemId: ID!
  itemType: String!
  description: String!
  amount: Float!
  taxAmount: Float!
  currency: String!
  revenueCenter: String
  postedAt: DateTime!
}

type AvailabilityResponse {
  propertyId: ID!
  checkInDate: Date!
  checkOutDate: Date!
  results: [RoomTypeAvailability!]!
}

type RoomTypeAvailability {
  roomType: RoomType!
  availableRooms: Int!
  totalRooms: Int!
  rate: Float!
  currency: String!
  ratePlans: [RatePlan!]!
}

type RatePlan {
  rateCode: String!
  rateName: String!
  totalAmount: Float!
  taxAmount: Float!
  currency: String!
  cancellationPolicy: String
  dailyRates: [DailyRate!]!
}

type DailyRate {
  date: Date!
  amount: Float!
  tax: Float!
}

type IPTVSession {
  sessionId: ID!
  token: String!
  expiresAt: DateTime!
  entitlements: [String!]!
  maxConcurrent: Int!
  currentChannel: Channel
  currentVOD: VODContent
}

type Channel {
  channelId: ID!
  channelNumber: Int!
  channelName: String!
  logo: String
  genre: String
  language: String
  hd: Boolean!
  isPremium: Boolean!
}

type VODContent {
  contentId: ID!
  title: String!
  description: String
  genre: String
  rating: String
  duration: Int
  posterUrl: String
  price: Float
  currency: String
}

type EPGEntry {
  epgId: ID!
  channel: Channel!
  title: String!
  description: String
  startTime: DateTime!
  endTime: DateTime!
  genre: String
  rating: String
}

type PricingRecommendation {
  recommendedRate: Float!
  confidence: Float!
  priceMultiplier: Float!
  expectedRevenue: Float!
  expectedOccupancy: Float!
  constraintsApplied: [String!]!
}

type DashboardMetrics {
  occupancyRate: Float!
  adr: Float!
  revpar: Float!
  totalRevenue: Float!
  totalBookings: Int!
  cancellationRate: Float!
  guestSatisfaction: Float!
}

type ConciergeResponse {
  response: String!
  actions: [ConciergeAction!]!
  requiresHuman: Boolean!
  sentiment: String!
  confidence: Float!
}

type ConciergeAction {
  actionType: String!
  parameters: JSON!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type CheckInResult {
  checkInId: ID!
  roomNumber: String!
  digitalKeyUrl: String
  wifiSsid: String
  folio: Folio!
}

type CheckOutResult {
  checkoutId: ID!
  finalBalance: Float!
  invoiceUrl: String
  loyaltyPointsEarned: Int!
}

type CheckInEvent {
  reservationId: ID!
  guest: Guest!
  room: Room!
  timestamp: DateTime!
}

type StreamResult {
  streamUrl: String!
  manifestUrl: String!
  drmLicenseUrl: String
  qualityOptions: [String!]!
  expiresIn: Int!
}

input CreateGuestInput {
  tenantId: ID!
  propertyId: ID
  firstName: String!
  lastName: String!
  email: String!
  phone: String
  language: String
  preferences: GuestPreferencesInput
}

input UpdateGuestInput {
  firstName: String
  lastName: String
  email: String
  phone: String
  preferences: GuestPreferencesInput
}

input GuestPreferencesInput {
  roomType: String
  bedType: String
  highFloor: Boolean
  quietRoom: Boolean
  dietaryRestrictions: [String!]
  preferredTemperature: Int
}

input CreateReservationInput {
  tenantId: ID!
  propertyId: ID!
  guestId: ID!
  roomTypeId: ID!
  checkInDate: Date!
  checkOutDate: Date!
  adults: Int = 2
  children: Int = 0
  rateCode: String
  specialRequests: String
}

input UpdateReservationInput {
  roomTypeId: ID
  checkInDate: Date
  checkOutDate: Date
  adults: Int
  children: Int
  specialRequests: String
}

input CheckInInput {
  roomId: ID!
  idVerified: Boolean
  paymentVerified: Boolean
  digitalKeyIssued: Boolean
}

input CheckOutInput {
  paymentMethod: String
  expressCheckout: Boolean
}

input PostChargeInput {
  itemType: String!
  description: String!
  amount: Float!
  revenueCenter: String
}

input PostPaymentInput {
  amount: Float!
  paymentMethod: String!
  referenceNumber: String
}

input CreateIPTVSessionInput {
  guestId: ID!
  roomId: ID!
  deviceType: String!
  deviceModel: String
  macAddress: String
}

input StartStreamInput {
  contentId: ID!
  contentType: String!
  quality: String
}

input ConciergeMessageInput {
  guestId: ID
  message: String!
  language: String
  channel: String
}

enum ReservationStatus {
  CONFIRMED
  CHECKED_IN
  CHECKED_OUT
  CANCELLED
  NO_SHOW
}

enum RoomStatus {
  AVAILABLE
  OCCUPIED
  DIRTY
  CLEAN
  MAINTENANCE
  OUT_OF_ORDER
  BLOCKED
}

enum HousekeepingStatus {
  CLEAN
  DIRTY
  INSPECTED
  IN_PROGRESS
}

scalar Date
scalar DateTime
scalar JSON
