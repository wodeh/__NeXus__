name: CI — IPTV Middleware
on:
  push:
    branches: [main, release/*, hotfix/*]
    paths:
      - 'services/iptv-middleware/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/iptv-middleware/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: services/iptv-middleware

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: |
          cd services/iptv-middleware
          go test -v -race ./...

  ffmpeg-validation:
    runs-on: ubuntu-latest
    container:
      image: jrottenberg/ffmpeg:6.0-nvidia
    steps:
      - uses: actions/checkout@v4
      - name: Validate FFmpeg configs
        run: |
          ffmpeg -f lavfi -i testsrc=duration=10:size=1280x720:rate=30             -c:v libx264 -f null -

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/iptv-middleware
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/nexus-platform/iptv-middleware:${{ github.sha }}
            ghcr.io/nexus-platform/iptv-middleware:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
