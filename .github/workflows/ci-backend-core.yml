name: CI — Backend Core

on:
  push:
    branches: [main, release/*, hotfix/*]
    paths:
      - 'services/backend-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/backend-core/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: |
          cd services/backend-core
          go vet ./...
      - name: go fmt check
        run: |
          cd services/backend-core
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Unformatted Go files:"
            gofmt -l .
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nexus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install dependencies
        run: |
          cd services/backend-core
          go mod download
      - name: Run tests
        run: |
          cd services/backend-core
          go test -v -race -coverprofile=coverage.out ./...
      - name: Build binary
        run: |
          cd services/backend-core
          go build -o /tmp/backend-core ./cmd/server

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/backend-core'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: services/backend-core
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/nexus-platform/backend-core:${{ github.sha }}
            ghcr.io/nexus-platform/backend-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
